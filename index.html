<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <title>সনাতন পঞ্জিকা ২০২৬</title>
  <meta name="description" content="সনাতন পঞ্জিকা ২০২৬ অ্যাপে একাদশী, পূজা-পার্বণ, মন্ত্র ও ধর্মীয় তথ্য জানুন।">
  <style>
    body {
      font-family: sans-serif;
      background: #fff8ed;
      color: #54221f;
      text-align: center;
      padding: 35px 18px;
      line-height: 1.8;
    }
    .card {
      max-width: 520px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 16px #0001;
    }
    h1 { color: #8b2026; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🪔 সনাতন পঞ্জিকা ২০২৬</h1>
    <p>সনাতন ধর্মাবলম্বীদের জন্য একটি ধর্মীয় তথ্যভিত্তিক অ্যাপ।</p>
    <p>এই অ্যাপে রয়েছে একাদশীর তালিকা ও মাহাত্ম্য,
    মন্ত্র, বাংলা ক্যালেন্ডার এবং পূজা-পার্বনের তথ্য।</p>
    <p>অ্যাপটি ব্যবহার করার আগে এর তথ্য যাচাই করে নিন।</p>
    <p>যোগাযোগের জন্য অ্যাপের প্রকৃত যোগাযোগের তথ্য এখানে যোগ করুন।</p>
  </div>
</body>
